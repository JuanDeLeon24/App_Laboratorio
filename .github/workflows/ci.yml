name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas (core JVM + app Robolectric)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace
      - name: Compilar APK debug y release sin firmar
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geodensidad-apk-y-reportes
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/
            core/build/reports/tests/
            app/build/ejemplos/
            core/build/ejemplos-pdf/
