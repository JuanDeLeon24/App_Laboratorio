name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # El runner de GitHub ya trae el Android SDK en $ANDROID_HOME; solo se aseguran las piezas usadas.
      - name: Componentes del Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      # Firma fija desde los Secrets del repositorio (si existen). Sin ellos, el APK sale con firma
      # temporal y no podrá instalarse encima de otro.
      - name: Preparar firma fija
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            if ! echo "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/geodensidad.jks" 2>/dev/null; then
              echo "::error::El secret SIGNING_KEYSTORE_BASE64 no es base64 válido: péguelo completo (termina en ==)."; exit 1
            fi
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/geodensidad.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secret SIGNING_KEYSTORE_BASE64: el APK no se podrá instalar como actualización."
          fi
      - name: Verificar la clave de firma
        if: env.SIGNING_KEYSTORE_FILE != ''
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          PW=$(printf '%s' "$SIGNING_STORE_PASSWORD" | tr -d ' \r\n\t')
          AL=$(printf '%s' "$SIGNING_KEY_ALIAS" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$SIGNING_KEYSTORE_FILE" -storepass "$PW" > /dev/null 2>&1; then
            echo "::error::SIGNING_STORE_PASSWORD no corresponde a la clave de SIGNING_KEYSTORE_BASE64. Vuelva a pegar la contraseña (24 caracteres) desde SECRETS_GITHUB.txt."; exit 1
          fi
          if ! keytool -list -keystore "$SIGNING_KEYSTORE_FILE" -storepass "$PW" -alias "$AL" > /dev/null 2>&1; then
            echo "::error::SIGNING_KEY_ALIAS debe ser exactamente: geodensidad"; exit 1
          fi
          echo "Clave de firma verificada."
      - name: Compilar APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoDensidad-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
      - name: Pruebas (core JVM + app Robolectric)
        run: ./gradlew :core:test :app:testDebugUnitTest
      - name: Diagnóstico de jars de Robolectric
        if: failure()
        run: ls -la app/build/robolectric-jars || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-de-pruebas
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
